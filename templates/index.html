<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Baixar Vídeo NEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="icone.png" rel="shortcut icon" type="image/png">
  </head>
  <body style="background-color: #DDD">
    <main class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row">
            <div class="d-flex justify-content-center mb-3">
                <h1 class="text-center">Baixar Vídeo NEM</h1>
            </div>
            <form action="/download" method="POST">
                <div class="col-12">
                    <input type="text" placeholder="Cole a URL do vídeo público do YouTube" class="form-control" name="url" autocomplete="off" required>
                </div>
                <div class="d-flex justify-content-center mt-5">
                    <button type="submit" class="btn btn-primary col-4"><b>Baixar vídeo</b></button>
                </div>
            </form>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
